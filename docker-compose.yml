version: "3.8"

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: docker-deploy-backend

    ports:
      - "4000:4000"

    env_file:
      - .env

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: docker-deploy-frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: unless-stopped
